# Portable tmux configuration

# Terminal behavior
set -g mouse on
set -s escape-time 0
set -g focus-events on
set -s set-clipboard on
set -g default-terminal "screen-256color"

# Prefix
unbind C-b
set -g prefix None
set -g prefix2 None
# Enter the prefix table explicitly so it can expire after 500ms. The helper
# prevents an older timeout from cancelling a newer prefix press from the same client.
bind -n C-s switch-client -T prefix \; run-shell -b "~/.config/tmux/prefix-timeout '#{client_name}'"
bind C-s resize-pane -Z

# Pane navigation (stop at window edges instead of wrapping)
bind h if-shell -F '#{!=:#{pane_at_left},1}' 'select-pane -L'
bind j if-shell -F '#{!=:#{pane_at_bottom},1}' 'select-pane -D'
bind k if-shell -F '#{!=:#{pane_at_top},1}' 'select-pane -U'
bind l if-shell -F '#{!=:#{pane_at_right},1}' 'select-pane -R'

# Pane resizing
bind -n M-h resize-pane -L 1
bind -n M-j resize-pane -D 1
bind -n M-k resize-pane -U 1
bind -n M-l resize-pane -R 1

# Refresh state lives in hidden environment variables: set-option would redraw
# every client on every mouse movement. These options are read-only format templates.
# Character formats build a lookup after expanding the numeric pane/window ID.
set -g @copy_refresh_size '#{E:#{a:35}#{a:123}COPY_REFRESH_SIZE_#{s/[^0-9]//:pane_id}#{a:125}}'
set -g @copy_refresh_pending '#{E:#{a:35}#{a:123}COPY_REFRESH_PENDING_#{s/[^0-9]//:pane_id}#{a:125}}'
set -g @copy_resize_generation '#{E:#{a:35}#{a:123}COPY_RESIZE_GENERATION_#{s/[^0-9]//:window_id}#{a:125}}'
set-hook -g window-layout-changed[91] {
    # Increment at command execution time, not when this command string is captured.
    run-shell -C 'set-environment -ghF COPY_RESIZE_GENERATION_#{s/[^0-9]//:window_id} "##{e|+:##{?COPY_RESIZE_GENERATION_#{s/[^0-9]//:window_id},##{COPY_RESIZE_GENERATION_#{s/[^0-9]//:window_id}},0},1}"'
    run-shell -C '#{P:
        set-environment -gh COPY_REFRESH_PENDING_#{s/[^0-9]//:pane_id} "#{||:#{E:@copy_refresh_pending},#{!=:#{E:@copy_refresh_size},#{pane_width}x#{pane_height}}}" ;
        set-environment -gh COPY_REFRESH_SIZE_#{s/[^0-9]//:pane_id} "#{pane_width}x#{pane_height}" ;
    }'
    # Reject stale timers before starting a shell or Python. ## defers the left
    # side until the timer fires; the right side is the generation captured now.
    run-shell -b -d 0.3 -C 'if-shell -F -t "#{window_id}" "##{&&:##{==:##{window_id},#{window_id}},##{==:##{E:@copy_resize_generation},#{E:@copy_resize_generation}}}" {
        run-shell -b -t "#{window_id}" "python3 ~/.config/tmux/refresh_copy_mode.py \"#{socket_path}\" \"#{window_id}\" \"#{E:@copy_resize_generation}\""
    }'
}
# Initialize size tracking for existing panes when loading the configuration.
run-shell -C '#{S:#{W:#{P:
    set-environment -gh COPY_REFRESH_SIZE_#{s/[^0-9]//:pane_id} "#{pane_width}x#{pane_height}" ;
    set-environment -gh COPY_REFRESH_PENDING_#{s/[^0-9]//:pane_id} 0 ;
}}}'

# Preset layouts: with two panes, only an active pane already in the standard
# wide-right layout switches to an equal top/bottom split; every other layout
# is normalized with the active pane wide on the right. With three or four panes,
# the active pane becomes the wide right pane; the others stack on the left.
setw -g main-pane-width 70%
bind Space run-shell "~/.config/tmux/layout-three-panes '#{pane_id}' '#{window_panes}'"

# Pane moving
bind H "select-pane -m; select-pane -L; swap-pane; select-pane -L; select-pane -M"
bind J "select-pane -m; select-pane -D; swap-pane; select-pane -D; select-pane -M"
bind K "select-pane -m; select-pane -U; swap-pane; select-pane -U; select-pane -M"
bind L "select-pane -m; select-pane -R; swap-pane; select-pane -R; select-pane -M"

# Splits inherit the current directory
bind s split-window -v -p 30 -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

# Windows and sessions
bind c new-window -c "#{pane_current_path}"
bind t new-window -c "#{pane_current_path}"
bind a last-window
bind A switch-client -l
bind 0 select-window -t 10
bind -r M-n swap-window -t +1\; select-window -t +1
bind -r M-p swap-window -t -1\; select-window -t -1
bind w choose-tree -Zw
bind f choose-tree -Zs
bind X kill-window
bind x kill-pane
bind b break-pane
bind m command-prompt -p "join pane to window:" "join-pane -t ':%%'"
bind . command-prompt -I "#S" "rename-session '%%'"

# Copy mode
setw -g mode-keys vi
set -g status-keys emacs
set -g word-separators " \t!#$%&'()*+,-./:;<=>?@[]{}|~`^_"

# Scrolling shell history enters copy mode. The pane process keeps running;
# only this client's viewport stops following the latest output.
bind -T root WheelUpPane if-shell -F '#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}' 'send-keys -M' 'copy-mode -e'

# Word motions split ASCII punctuation, Han characters and Unicode punctuation.
# Path objects retain ASCII punctuation but use the same Chinese boundaries.
bind -T copy-mode-vi b run-shell "python3 ~/.config/tmux/copy_mode_word.py '#{pane_id}' b"
bind -T copy-mode-vi e run-shell "python3 ~/.config/tmux/copy_mode_word.py '#{pane_id}' e"
bind -T copy-mode-vi w run-shell "python3 ~/.config/tmux/copy_mode_word.py '#{pane_id}' w"
# Mirror tmux's numeric prefix for the helper; native send-keys consumes it too.
set-hook -g after-send-keys[90] 'set-option -pqu @copy_word_count'
bind -T copy-mode-vi 1 command-prompt -N -I 1 -p '(repeat)' { send-keys -N '%%'; set-option -p @copy_word_count '%%' }
bind -T copy-mode-vi 2 command-prompt -N -I 2 -p '(repeat)' { send-keys -N '%%'; set-option -p @copy_word_count '%%' }
bind -T copy-mode-vi 3 command-prompt -N -I 3 -p '(repeat)' { send-keys -N '%%'; set-option -p @copy_word_count '%%' }
bind -T copy-mode-vi 4 command-prompt -N -I 4 -p '(repeat)' { send-keys -N '%%'; set-option -p @copy_word_count '%%' }
bind -T copy-mode-vi 5 command-prompt -N -I 5 -p '(repeat)' { send-keys -N '%%'; set-option -p @copy_word_count '%%' }
bind -T copy-mode-vi 6 command-prompt -N -I 6 -p '(repeat)' { send-keys -N '%%'; set-option -p @copy_word_count '%%' }
bind -T copy-mode-vi 7 command-prompt -N -I 7 -p '(repeat)' { send-keys -N '%%'; set-option -p @copy_word_count '%%' }
bind -T copy-mode-vi 8 command-prompt -N -I 8 -p '(repeat)' { send-keys -N '%%'; set-option -p @copy_word_count '%%' }
bind -T copy-mode-vi 9 command-prompt -N -I 9 -p '(repeat)' { send-keys -N '%%'; set-option -p @copy_word_count '%%' }
bind Escape copy-mode
bind Enter copy-mode
bind P paste-buffer
bind -T copy-mode-vi q send -X cancel
bind -T copy-mode-vi Escape set-option -pqu @open_path_search_id \; set-option -pqu @open_path_search_status \; refresh-client -S \; send -X clear-selection
bind -T copy-mode-vi S-Enter run-shell "~/.config/tmux/copy-mode-enter '#{pane_id}'"
bind -T copy-mode-vi Enter if-shell -F '#{selection_present}' {
    send -X copy-pipe-no-clear "~/.config/tmux/open-path '#{pane_id}' pane exit-copy"
    send -X clear-selection
} {
    run-shell "python3 ~/.config/tmux/copy_mode_word.py '#{pane_id}' ip"
    send -X copy-pipe-no-clear "~/.config/tmux/open-path '#{pane_id}' pane exit-copy"
    send -X clear-selection
}
bind -T copy-mode-vi d send -X clear-selection
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v {
    send -X selection-mode char
    if-shell -F '#{==:#{rectangle_toggle},0}' {
        if-shell -F '#{selection_active}' {
            if-shell -F '#{||:#{e|<:#{copy_cursor_x},#{selection_start_x}},#{e|<:#{copy_cursor_x},#{selection_end_x}}}' 'send -X other-end'
        } {
            send -X begin-selection
        }
        # Land on the last cell of a wide character, not its left half.
        send -X cursor-right
        send -X cursor-left
    }
    send -X rectangle-toggle
}
bind -T copy-mode-vi y send -X copy-selection
bind -T copy-mode-vi p paste-buffer
bind -T copy-mode-vi o send -X copy-pipe-no-clear "~/.config/tmux/open-path '#{pane_id}'" \; send -X clear-selection
bind -T copy-mode-vi O send -X copy-pipe-no-clear "~/.config/tmux/open-path '#{pane_id}' window" \; send -X clear-selection

# Vim-style word text objects. The temporary tables consume the key after
# i/a, then copy mode returns to copy-mode-vi automatically.
# `viw` selects a word or whitespace; `vaw` also includes adjacent whitespace.
# `vip` selects a path without crossing whitespace, Han or Chinese punctuation.
bind -T copy-mode-vi i switch-client -T copy-mode-vi-inner
bind -T copy-mode-vi a switch-client -T copy-mode-vi-around
bind -T copy-mode-vi-inner w run-shell "python3 ~/.config/tmux/copy_mode_word.py '#{pane_id}' iw"
bind -T copy-mode-vi-inner p run-shell "python3 ~/.config/tmux/copy_mode_word.py '#{pane_id}' ip"
bind -T copy-mode-vi-around w run-shell "python3 ~/.config/tmux/copy_mode_word.py '#{pane_id}' aw"
# Quotes and balanced blocks; either bracket and Vim's b/B aliases work.
bind -T copy-mode-vi-inner '"' run-shell "python3 ~/.config/tmux/copy_mode_word.py '#{pane_id}' i-double-quote"
bind -T copy-mode-vi-around '"' run-shell "python3 ~/.config/tmux/copy_mode_word.py '#{pane_id}' a-double-quote"
bind -T copy-mode-vi-inner "'" run-shell "python3 ~/.config/tmux/copy_mode_word.py '#{pane_id}' i-single-quote"
bind -T copy-mode-vi-around "'" run-shell "python3 ~/.config/tmux/copy_mode_word.py '#{pane_id}' a-single-quote"
bind -T copy-mode-vi-inner '`' run-shell "python3 ~/.config/tmux/copy_mode_word.py '#{pane_id}' i-backtick"
bind -T copy-mode-vi-around '`' run-shell "python3 ~/.config/tmux/copy_mode_word.py '#{pane_id}' a-backtick"
bind -T copy-mode-vi-inner '(' run-shell "python3 ~/.config/tmux/copy_mode_word.py '#{pane_id}' i-paren"
bind -T copy-mode-vi-inner ')' run-shell "python3 ~/.config/tmux/copy_mode_word.py '#{pane_id}' i-paren"
bind -T copy-mode-vi-inner b run-shell "python3 ~/.config/tmux/copy_mode_word.py '#{pane_id}' i-paren"
bind -T copy-mode-vi-around '(' run-shell "python3 ~/.config/tmux/copy_mode_word.py '#{pane_id}' a-paren"
bind -T copy-mode-vi-around ')' run-shell "python3 ~/.config/tmux/copy_mode_word.py '#{pane_id}' a-paren"
bind -T copy-mode-vi-around b run-shell "python3 ~/.config/tmux/copy_mode_word.py '#{pane_id}' a-paren"
bind -T copy-mode-vi-inner '[' run-shell "python3 ~/.config/tmux/copy_mode_word.py '#{pane_id}' i-bracket"
bind -T copy-mode-vi-inner ']' run-shell "python3 ~/.config/tmux/copy_mode_word.py '#{pane_id}' i-bracket"
bind -T copy-mode-vi-around '[' run-shell "python3 ~/.config/tmux/copy_mode_word.py '#{pane_id}' a-bracket"
bind -T copy-mode-vi-around ']' run-shell "python3 ~/.config/tmux/copy_mode_word.py '#{pane_id}' a-bracket"
bind -T copy-mode-vi-inner '{' run-shell "python3 ~/.config/tmux/copy_mode_word.py '#{pane_id}' i-brace"
bind -T copy-mode-vi-inner '}' run-shell "python3 ~/.config/tmux/copy_mode_word.py '#{pane_id}' i-brace"
bind -T copy-mode-vi-inner B run-shell "python3 ~/.config/tmux/copy_mode_word.py '#{pane_id}' i-brace"
bind -T copy-mode-vi-around '{' run-shell "python3 ~/.config/tmux/copy_mode_word.py '#{pane_id}' a-brace"
bind -T copy-mode-vi-around '}' run-shell "python3 ~/.config/tmux/copy_mode_word.py '#{pane_id}' a-brace"
bind -T copy-mode-vi-around B run-shell "python3 ~/.config/tmux/copy_mode_word.py '#{pane_id}' a-brace"
bind -T copy-mode-vi-inner '<' run-shell "python3 ~/.config/tmux/copy_mode_word.py '#{pane_id}' i-angle"
bind -T copy-mode-vi-inner '>' run-shell "python3 ~/.config/tmux/copy_mode_word.py '#{pane_id}' i-angle"
bind -T copy-mode-vi-around '<' run-shell "python3 ~/.config/tmux/copy_mode_word.py '#{pane_id}' a-angle"
bind -T copy-mode-vi-around '>' run-shell "python3 ~/.config/tmux/copy_mode_word.py '#{pane_id}' a-angle"
bind -T copy-mode-vi-inner q send -X cancel
bind -T copy-mode-vi-around q send -X cancel
bind -T copy-mode-vi-inner Any switch-client -T copy-mode-vi
bind -T copy-mode-vi-around Any switch-client -T copy-mode-vi

# Override the remaining vi defaults which would otherwise leave copy mode.
bind -T copy-mode-vi A send -X append-selection
bind -T copy-mode-vi D send -X copy-pipe-end-of-line
bind -T copy-mode-vi C-c send -X clear-selection
bind -T copy-mode-vi C-j send -X copy-pipe-no-clear

# A plain click clears any selection and moves the copy cursor to the clicked cell.
bind -T copy-mode-vi MouseDown1Pane select-pane \; send -X clear-selection
bind -T copy-mode MouseDown1Pane select-pane \; send -X clear-selection

# Mouse selection copies on release and clears the highlight without leaving copy mode.
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear \; send -X clear-selection
bind -T copy-mode MouseDragEnd1Pane send -X copy-selection-no-clear \; send -X clear-selection
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; run-shell -d 0.3 \; send -X copy-selection-no-clear \; send -X clear-selection
bind -T copy-mode DoubleClick1Pane select-pane \; send -X select-word \; run-shell -d 0.3 \; send -X copy-selection-no-clear \; send -X clear-selection
bind -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line \; run-shell -d 0.3 \; send -X copy-selection-no-clear \; send -X clear-selection
bind -T copy-mode TripleClick1Pane select-pane \; send -X select-line \; run-shell -d 0.3 \; send -X copy-selection-no-clear \; send -X clear-selection

# Indexing and history
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 10000

# Titles and messages
setw -g automatic-rename on
set -g set-titles on
set -g display-panes-time 1000
set -g display-time 1000

# Status bar — Carbonfox monochrome
set -g status on
set -g status-interval 60
set -g status-justify centre
set -g status-left-length 40
set -g status-right-length 80
set -g status-style 'bg=#101010,fg=#b0b0b0'
set -g status-left '#[bg=#202020,fg=#f0f0f0,bold] #S '
set -g status-right '#{?@open_path_search_status,#[bg=#d0d0d0#,fg=#080808#,bold] #{@open_path_search_status} ,#[bg=#181818#,fg=#b8b8b8] %H:%M }'
set -g message-style 'bg=#202020,fg=#f0f0f0'
set -g message-command-style 'bg=#202020,fg=#f0f0f0'
set -g mode-style 'bg=#d0d0d0,fg=#080808,bold'

# Window and pane appearance
setw -g pane-border-status off
set -g pane-border-style 'fg=#404040'
set -g pane-active-border-style 'fg=#b8b8b8'
setw -g window-status-separator ' '
setw -g window-status-format '#[fg=#686868]#{window_index}:#W'
setw -g window-status-current-format '#[fg=#f0f0f0,bold]#{window_index}:#W'
setw -g window-status-bell-style 'fg=#f0f0f0,bold,reverse'

# make pi happy
set -as terminal-features ',xterm-kitty:extkeys'
set -g extended-keys on
set -g extended-keys-format csi-u
