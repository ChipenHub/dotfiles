# Portable tmux configuration

# Terminal behavior
set -g mouse on
set -s escape-time 0
set -g focus-events on
set -s set-clipboard on
set -g default-terminal "screen-256color"

# Prefix
unbind C-b
set -g prefix C-s
set -g prefix2 None
bind C-s send-prefix

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing
bind -n M-h resize-pane -L 1
bind -n M-j resize-pane -D 1
bind -n M-k resize-pane -U 1
bind -n M-l resize-pane -R 1

# Pane moving
bind H "select-pane -m; select-pane -L; swap-pane; select-pane -L; select-pane -M"
bind J "select-pane -m; select-pane -D; swap-pane; select-pane -D; select-pane -M"
bind K "select-pane -m; select-pane -U; swap-pane; select-pane -U; select-pane -M"
bind L "select-pane -m; select-pane -R; swap-pane; select-pane -R; select-pane -M"

# Splits inherit the current directory
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

# Windows and sessions
bind c new-window -c "#{pane_current_path}"
bind t new-window -c "#{pane_current_path}"
bind a last-window
bind A switch-client -l
bind 0 select-window -t 10
bind -r M-n swap-window -t +1\; select-window -t +1
bind -r M-p swap-window -t -1\; select-window -t -1
bind w choose-tree -Zw
bind f choose-tree -Zs
bind X kill-window
bind x kill-pane
bind b break-pane
bind m command-prompt -p "join pane to window:" "join-pane -t ':%%'"
bind . command-prompt -I "#S" "rename-session '%%'"

# Copy mode
setw -g mode-keys vi
set -g word-separators " \t!#$%&'()*+,-./:;<=>?@[]{}|~`^_"

# Outside copy mode, wheel events only go to applications which handle them.
# Plain shell scrolling no longer enters copy mode and freezes the pane view.
bind -T root WheelUpPane if-shell -F '#{||:#{alternate_on},#{mouse_any_flag}}' 'send-keys -M'
bind -T root WheelDownPane if-shell -F '#{||:#{alternate_on},#{mouse_any_flag}}' 'send-keys -M'

# Symbol-aware word mode kept for viw, while vip keeps space-separated behavior.
bind Escape copy-mode
bind Enter copy-mode
bind P paste-buffer
bind -T copy-mode-vi q send -X cancel
bind -T copy-mode-vi Escape send -X clear-selection
bind -T copy-mode-vi Enter send -X copy-selection-no-clear
bind -T copy-mode-vi d send -X clear-selection
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection
bind -T copy-mode-vi p paste-buffer
bind -T copy-mode-vi o send -X copy-pipe-no-clear "~/.config/tmux/open-path '#{pane_id}'"
bind -T copy-mode-vi O send -X copy-pipe-no-clear "~/.config/tmux/open-path '#{pane_id}' window"

# Vim-style word text objects. The temporary tables consume the key after
# i/a, then copy mode returns to copy-mode-vi automatically.
# `viw` (iw) uses symbol-aware boundaries;
# `vip` (ip) keeps the old space-only word boundary for quick path copy.
bind -T copy-mode-vi i send -X clear-selection \; switch-client -T copy-mode-vi-inner
bind -T copy-mode-vi a send -X clear-selection \; switch-client -T copy-mode-vi-around
bind -T copy-mode-vi-inner w send -X select-word
bind -T copy-mode-vi-inner p set -g word-separators " " \; send -X select-word \; set -g word-separators " \t!#$%&'()*+,-./:;<=>?@[]{}|~`^_"
bind -T copy-mode-vi-around w send -X select-word \; send -X selection-mode char \; send -X next-word \; send -X cursor-left
bind -T copy-mode-vi-inner q send -X cancel
bind -T copy-mode-vi-around q send -X cancel
bind -T copy-mode-vi-inner Any switch-client -T copy-mode-vi
bind -T copy-mode-vi-around Any switch-client -T copy-mode-vi

# Override the remaining vi defaults which would otherwise leave copy mode.
bind -T copy-mode-vi A send -X append-selection
bind -T copy-mode-vi D send -X copy-pipe-end-of-line
bind -T copy-mode-vi C-c send -X clear-selection
bind -T copy-mode-vi C-j send -X copy-pipe-no-clear

# Mouse selection copies on release, then returns to the live terminal.
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel
bind -T copy-mode MouseDragEnd1Pane send -X copy-selection-and-cancel
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; run-shell -d 0.3 \; send -X copy-selection-and-cancel
bind -T copy-mode DoubleClick1Pane select-pane \; send -X select-word \; run-shell -d 0.3 \; send -X copy-selection-and-cancel
bind -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line \; run-shell -d 0.3 \; send -X copy-selection-and-cancel
bind -T copy-mode TripleClick1Pane select-pane \; send -X select-line \; run-shell -d 0.3 \; send -X copy-selection-and-cancel

# Indexing and history
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 10000

# Titles and messages
setw -g automatic-rename on
set -g set-titles on
set -g display-panes-time 1000
set -g display-time 1000

# Status bar
set -g status on
set -g status-interval 60
set -g status-justify centre
set -g status-left-length 40
set -g status-right-length 20
set -g status-left '#[bg=colour111,fg=colour234,bold] #S '
set -g status-right '#[bg=colour237,fg=colour250] %H:%M '
set -g status-style 'bg=colour234,fg=colour250'
set -g message-style 'bg=colour179,fg=colour234'
set -g message-command-style 'bg=colour111,fg=colour234'
set -g mode-style 'bg=colour215,fg=colour234'

# Window and pane appearance
setw -g pane-border-status top
setw -g pane-border-format '#{pane_index} #{?@open_path_name,#{@open_path_name},#{pane_current_command}} #{b:pane_current_path}'
set -g pane-border-style 'fg=colour102'
set -g pane-active-border-style 'fg=colour111'
setw -g window-status-separator ' '
setw -g window-status-format '#[bg=colour234,fg=colour102]#{window_index} #W'
setw -g window-status-current-format '#[bg=colour238,fg=colour111,bold]#{window_index} #W'
setw -g window-status-bell-style 'fg=colour141,bg=colour234'

# make pi happy
set -g extended-keys on
set -g extended-keys-format csi-u
