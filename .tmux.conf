# Portable tmux configuration

# Terminal behavior
set -g mouse on
set -s escape-time 0
set -g focus-events on
set -s set-clipboard on
set -g default-terminal "screen-256color"

# Prefix
unbind C-b
set -g prefix C-s
set -g prefix2 None
bind C-s resize-pane -Z

# Pane navigation (stop at window edges instead of wrapping)
bind h if-shell -F '#{!=:#{pane_at_left},1}' 'select-pane -L'
bind j if-shell -F '#{!=:#{pane_at_bottom},1}' 'select-pane -D'
bind k if-shell -F '#{!=:#{pane_at_top},1}' 'select-pane -U'
bind l if-shell -F '#{!=:#{pane_at_right},1}' 'select-pane -R'

# Pane resizing
bind -n M-h resize-pane -L 1
bind -n M-j resize-pane -D 1
bind -n M-k resize-pane -U 1
bind -n M-l resize-pane -R 1

# Preset layouts: with two panes, only an active pane already in the standard
# wide-right layout switches to an equal top/bottom split; every other layout
# is normalized with the active pane wide on the right. With three or four panes,
# the active pane becomes the wide right pane; the others stack on the left.
setw -g main-pane-width 70%
bind Space run-shell "~/.config/tmux/layout-three-panes '#{pane_id}' '#{window_panes}'"

# Pane moving
bind H "select-pane -m; select-pane -L; swap-pane; select-pane -L; select-pane -M"
bind J "select-pane -m; select-pane -D; swap-pane; select-pane -D; select-pane -M"
bind K "select-pane -m; select-pane -U; swap-pane; select-pane -U; select-pane -M"
bind L "select-pane -m; select-pane -R; swap-pane; select-pane -R; select-pane -M"

# Splits inherit the current directory
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

# Windows and sessions
bind c new-window -c "#{pane_current_path}"
bind t new-window -c "#{pane_current_path}"
bind a last-window
bind A switch-client -l
bind 0 select-window -t 10
bind -r M-n swap-window -t +1\; select-window -t +1
bind -r M-p swap-window -t -1\; select-window -t -1
bind w choose-tree -Zw
bind f choose-tree -Zs
bind X kill-window
bind x kill-pane
bind b break-pane
bind m command-prompt -p "join pane to window:" "join-pane -t ':%%'"
bind . command-prompt -I "#S" "rename-session '%%'"

# Copy mode
setw -g mode-keys vi
set -g status-keys emacs
set -g word-separators " \t!#$%&'()*+,-./:;<=>?@[]{}|~`^_"

# Scrolling shell history enters copy mode. The pane process keeps running;
# only this client's viewport stops following the latest output.
bind -T root WheelUpPane if-shell -F '#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}' 'send-keys -M' 'copy-mode -e'

# Symbol-aware word mode kept for viw, while vip keeps space-separated behavior.
bind Escape copy-mode
bind Enter copy-mode
bind P paste-buffer
bind -T copy-mode-vi q send -X cancel
bind -T copy-mode-vi Escape set-option -pqu @open_path_search_id \; set-option -pqu @open_path_search_status \; refresh-client -S \; send -X clear-selection
bind -T copy-mode-vi S-Enter run-shell "~/.config/tmux/copy-mode-enter '#{pane_id}'"
bind -T copy-mode-vi Enter if-shell -F '#{selection_present}' {
    send -X copy-pipe-no-clear "~/.config/tmux/open-path '#{pane_id}' pane exit-copy"
    send -X clear-selection
} {
    send -X clear-selection
    set -g word-separators " "
    send -X select-word
    set -g word-separators " \t!#$%&'()*+,-./:;<=>?@[]{}|~`^_"
    send -X copy-pipe-no-clear "~/.config/tmux/open-path '#{pane_id}' pane exit-copy"
    send -X clear-selection
}
bind -T copy-mode-vi d send -X clear-selection
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X selection-mode char \; send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection
bind -T copy-mode-vi p paste-buffer
bind -T copy-mode-vi o send -X copy-pipe-no-clear "~/.config/tmux/open-path '#{pane_id}'" \; send -X clear-selection
bind -T copy-mode-vi O send -X copy-pipe-no-clear "~/.config/tmux/open-path '#{pane_id}' window" \; send -X clear-selection

# Vim-style word text objects. The temporary tables consume the key after
# i/a, then copy mode returns to copy-mode-vi automatically.
# `viw` (iw) uses symbol-aware boundaries;
# `vip` (ip) keeps the old space-only word boundary for quick path copy.
bind -T copy-mode-vi i send -X clear-selection \; switch-client -T copy-mode-vi-inner
bind -T copy-mode-vi a send -X clear-selection \; switch-client -T copy-mode-vi-around
bind -T copy-mode-vi-inner w send -X select-word
bind -T copy-mode-vi-inner p set -g word-separators " " \; send -X select-word \; set -g word-separators " \t!#$%&'()*+,-./:;<=>?@[]{}|~`^_"
bind -T copy-mode-vi-around w send -X select-word \; send -X selection-mode char \; send -X next-word \; send -X cursor-left
bind -T copy-mode-vi-inner q send -X cancel
bind -T copy-mode-vi-around q send -X cancel
bind -T copy-mode-vi-inner Any switch-client -T copy-mode-vi
bind -T copy-mode-vi-around Any switch-client -T copy-mode-vi

# Override the remaining vi defaults which would otherwise leave copy mode.
bind -T copy-mode-vi A send -X append-selection
bind -T copy-mode-vi D send -X copy-pipe-end-of-line
bind -T copy-mode-vi C-c send -X clear-selection
bind -T copy-mode-vi C-j send -X copy-pipe-no-clear

# A plain click clears any selection and moves the copy cursor to the clicked cell.
bind -T copy-mode-vi MouseDown1Pane select-pane \; send -X clear-selection
bind -T copy-mode MouseDown1Pane select-pane \; send -X clear-selection

# Mouse selection copies on release and clears the highlight without leaving copy mode.
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear \; send -X clear-selection
bind -T copy-mode MouseDragEnd1Pane send -X copy-selection-no-clear \; send -X clear-selection
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; run-shell -d 0.3 \; send -X copy-selection-no-clear \; send -X clear-selection
bind -T copy-mode DoubleClick1Pane select-pane \; send -X select-word \; run-shell -d 0.3 \; send -X copy-selection-no-clear \; send -X clear-selection
bind -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line \; run-shell -d 0.3 \; send -X copy-selection-no-clear \; send -X clear-selection
bind -T copy-mode TripleClick1Pane select-pane \; send -X select-line \; run-shell -d 0.3 \; send -X copy-selection-no-clear \; send -X clear-selection

# Indexing and history
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 10000

# Titles and messages
setw -g automatic-rename on
set -g set-titles on
set -g display-panes-time 1000
set -g display-time 1000

# Status bar — Carbonfox monochrome
set -g status on
set -g status-interval 60
set -g status-justify centre
set -g status-left-length 40
set -g status-right-length 80
set -g status-style 'bg=#101010,fg=#b0b0b0'
set -g status-left '#[bg=#202020,fg=#f0f0f0,bold] #S '
set -g status-right '#{?@open_path_search_status,#[bg=#d0d0d0#,fg=#080808#,bold] #{@open_path_search_status} ,#[bg=#181818#,fg=#b8b8b8] %H:%M }'
set -g message-style 'bg=#202020,fg=#f0f0f0'
set -g message-command-style 'bg=#202020,fg=#f0f0f0'
set -g mode-style 'bg=#d0d0d0,fg=#080808,bold'

# Window and pane appearance
setw -g pane-border-status off
set -g pane-border-style 'fg=#404040'
set -g pane-active-border-style 'fg=#b8b8b8'
setw -g window-status-separator ' '
setw -g window-status-format '#[fg=#686868]#{window_index}:#W'
setw -g window-status-current-format '#[fg=#f0f0f0,bold]#{window_index}:#W'
setw -g window-status-bell-style 'fg=#f0f0f0,bold,reverse'

# make pi happy
set -as terminal-features ',xterm-kitty:extkeys'
set -g extended-keys on
set -g extended-keys-format csi-u
